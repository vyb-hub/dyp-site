<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DYP — Admin Login</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#1d1d1f;--white:#f5f5f7;--gray:#6e6e73;--light:#fbfbfd;--mid:#e8e8ed;
  --blue:#0071e3;--blue-h:#0077ed;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;
}
body{font-family:var(--font);background:#1d1d1f;color:var(--black);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 22px}
.auth-card{background:#fff;border-radius:18px;padding:40px 44px;width:100%;max-width:360px;box-shadow:0 8px 48px rgba(0,0,0,0.4)}
.auth-logo{font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:4px;letter-spacing:-0.02em}
.auth-badge{display:inline-block;background:#1d1d1f;color:#f5f5f7;font-size:0.62rem;font-weight:600;letter-spacing:0.08em;padding:3px 10px;border-radius:980px;margin:0 auto 20px;display:block;text-align:center;width:fit-content;margin-left:auto;margin-right:auto}
.auth-sub{font-size:0.85rem;color:var(--gray);text-align:center;margin-bottom:28px;font-weight:300}
.field{margin-bottom:14px}
.field label{display:block;font-size:0.75rem;font-weight:500;color:var(--black);margin-bottom:5px}
.field input{width:100%;background:var(--light);border:1px solid var(--mid);border-radius:10px;padding:10px 14px;color:var(--black);font-family:var(--font);font-size:0.88rem;outline:none;transition:border-color 0.15s,box-shadow 0.15s}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,0.1);background:#fff}
.field input::placeholder{color:#b0b0b8}
.submit-btn{width:100%;padding:11px;background:#1d1d1f;color:#fff;border:none;border-radius:980px;font-family:var(--font);font-size:0.9rem;font-weight:500;cursor:pointer;transition:background 0.2s;margin-top:6px}
.submit-btn:hover{background:#333}
.submit-btn:disabled{background:var(--mid);cursor:not-allowed}
.auth-footer{text-align:center;font-size:0.78rem;color:var(--gray);margin-top:18px}
.auth-link{color:var(--blue);text-decoration:none}
.auth-link:hover{text-decoration:underline}
.msg{border-radius:9px;padding:10px 14px;font-size:0.8rem;margin-bottom:14px;display:none}
.msg.show{display:block}
.msg-err{background:#fff2f2;border:1px solid #fcc;color:#c62828}
@media(max-width:480px){.auth-card{padding:30px 22px;border-radius:14px}}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">DYP</div>
    <span class="auth-badge">Admin Access</span>
    <div class="auth-sub">Sign in with your admin credentials</div>
    <div class="msg msg-err" id="err-msg"></div>
    <form id="admin-login-form" onsubmit="handleAdminLogin(event)" novalidate autocomplete="on">
      <div class="field">
        <label>Admin Email</label>
        <input type="email" id="email" placeholder="admin@dyp.co" required autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">Sign In as Admin</button>
    </form>
    <div class="auth-footer"><a href="login.html" class="auth-link">← Back to user login</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/dyp-supabase.js"></script>
<script>
const params = new URLSearchParams(location.search);
if (params.get('error') === 'unauthorized') {
  document.getElementById('err-msg').textContent = 'You do not have admin access.';
  document.getElementById('err-msg').classList.add('show');
}

(async () => {
  const result = await getCurrentUser();
  if (result) {
    const profile = await getUserProfile(result.id);
    if (profile?.role === 'admin') window.location.href = 'admin.html';
  }
})();

async function handleAdminLogin(e) {
  e.preventDefault();
  const email    = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('submit-btn');
  const errEl    = document.getElementById('err-msg');

  errEl.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    btn.disabled = false;
    btn.textContent = 'Sign In as Admin';
    showErr('Incorrect email or password.');
    return;
  }

  // Verify admin role
  const profile = await getUserProfile(data.user.id);
  if (!profile || profile.role !== 'admin') {
    await sb.auth.signOut();
    btn.disabled = false;
    btn.textContent = 'Sign In as Admin';
    showErr('This account does not have admin access.');
    return;
  }

  window.location.href = 'admin.html';
}

function showErr(msg) {
  const el = document.getElementById('err-msg');
  el.textContent = msg;
  el.classList.add('show');
}
</script>
</body>
</html>
