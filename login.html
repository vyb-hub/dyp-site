<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DYP — Sign In</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#1d1d1f;--white:#f5f5f7;--gray:#6e6e73;--light:#fbfbfd;--mid:#e8e8ed;
  --blue:#0071e3;--blue-h:#0077ed;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;
}
body{font-family:var(--font);background:var(--light);color:var(--black);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
nav{position:fixed;top:0;left:0;right:0;z-index:9999;height:44px;background:rgba(251,251,253,0.85);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:center}
.nav-inner{width:100%;max-width:980px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.nav-logo{font-size:1.25rem;font-weight:600;color:var(--black);text-decoration:none;letter-spacing:-0.01em}
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:80px 22px 40px}
.auth-card{background:#fff;border-radius:18px;padding:40px 44px;width:100%;max-width:380px;box-shadow:0 2px 24px rgba(0,0,0,0.06),0 0 0 1px rgba(0,0,0,0.04)}
.auth-logo{font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:4px;letter-spacing:-0.02em}
.auth-sub{font-size:0.85rem;color:var(--gray);text-align:center;margin-bottom:28px;font-weight:300}
.field{margin-bottom:14px}
.field label{display:block;font-size:0.75rem;font-weight:500;color:var(--black);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
.field input{width:100%;background:var(--light);border:1px solid var(--mid);border-radius:10px;padding:10px 14px;color:var(--black);font-family:var(--font);font-size:0.88rem;outline:none;transition:border-color 0.15s,box-shadow 0.15s}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,0.1);background:#fff}
.field input::placeholder{color:#b0b0b8}
.submit-btn{width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:980px;font-family:var(--font);font-size:0.9rem;font-weight:500;cursor:pointer;transition:background 0.2s;margin-top:6px}
.submit-btn:hover{background:var(--blue-h)}
.submit-btn:disabled{background:var(--mid);cursor:not-allowed}
.auth-footer{text-align:center;font-size:0.82rem;color:var(--gray);margin-top:18px}
.auth-link{color:var(--blue);text-decoration:none}
.auth-link:hover{text-decoration:underline}
.msg{border-radius:9px;padding:10px 14px;font-size:0.8rem;margin-bottom:14px;display:none}
.msg.show{display:block}
.msg-err{background:#fff2f2;border:1px solid #fcc;color:#c62828}
.divider{border:none;border-top:1px solid var(--mid);margin:20px 0}
.admin-link{display:block;text-align:center;font-size:0.75rem;color:var(--gray);margin-top:14px;text-decoration:none}
.admin-link:hover{color:var(--black)}
@media(max-width:480px){.auth-card{padding:30px 22px;border-radius:14px}}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">DYP</a>
    <span style="font-size:0.78rem;color:var(--gray)">New here? <a href="signup.html" class="auth-link">Create account</a></span>
  </div>
</nav>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">DYP</div>
    <div class="auth-sub">Sign in to your account</div>
    <div class="msg msg-err" id="err-msg"></div>
    <form id="login-form" onsubmit="handleLogin(event)" novalidate autocomplete="on">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@company.com" required autocomplete="email"/>
      </div>
      <div class="field">
        <label>
          Password
          <a href="#" class="auth-link" style="font-size:0.72rem;font-weight:400" onclick="handleForgotPassword(event)">Forgot password?</a>
        </label>
        <input type="password" id="password" placeholder="Your password" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">Sign In</button>
    </form>
    <hr class="divider"/>
    <div class="auth-footer">Don't have an account? <a href="signup.html" class="auth-link">Create one for free →</a></div>
    <a href="admin-login.html" class="admin-link">Admin access →</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/dyp-supabase.js"></script>
<script>
// Check URL error params
const params = new URLSearchParams(location.search);
if (params.get('session') === 'expired') {
  document.getElementById('err-msg').textContent = 'Your session expired. Please sign in again.';
  document.getElementById('err-msg').classList.add('show');
}

// Redirect if already logged in
(async () => {
  const user = await getCurrentUser();
  if (user) window.location.href = params.get('redirect') || 'products.html';
})();

async function handleLogin(e) {
  e.preventDefault();
  const email    = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('submit-btn');

  document.getElementById('err-msg').classList.remove('show');

  if (!email || !password) { showErr('Please enter your email and password.'); return; }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  const { error } = await sb.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = 'Sign In';

  if (error) {
    showErr(friendlyError(error.message));
    return;
  }

  const redirectTo = params.get('redirect') || 'products.html';
  window.location.href = redirectTo;
}

async function handleForgotPassword(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  if (!email) { showErr('Enter your email address first, then click "Forgot password".'); return; }

  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/login.html'
  });
  if (error) { showErr(error.message); return; }
  showErr(''); // clear
  const el = document.getElementById('err-msg');
  el.style.background = '#f0fff4';
  el.style.borderColor = '#b2dfdb';
  el.style.color = '#1b5e20';
  el.textContent = 'Password reset email sent — check your inbox.';
  el.classList.add('show');
}

function showErr(msg) {
  const el = document.getElementById('err-msg');
  el.style.cssText = ''; // reset
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}

function friendlyError(msg) {
  if (msg.includes('Invalid login')) return 'Incorrect email or password. Please try again.';
  return msg;
}
</script>
</body>
</html>
